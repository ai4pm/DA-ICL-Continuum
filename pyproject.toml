[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bibm-replication"
version = "1.0.0"
description = "Algorithm-focused replication package for DA-ICL ancestry-continuum modeling"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
authors = [
  {name = "Weizhi Li"},
  {name = "Yan Cui"},
]
dependencies = [
  "numpy==2.1.2",
  "pandas==2.3.1",
  "scipy==1.16.1",
  "scikit-learn==1.6.1",
  "networkx==3.3",
  "matplotlib==3.10.5",
  "seaborn==0.13.2",
  "PyYAML==6.0.2",
  "xgboost==3.2.0",
  "torch==2.6.0",
  "tabpfn==7.1.0",
  "huggingface-hub==0.30.2",
]

[project.optional-dependencies]
test = ["pytest==8.3.5", "pytest-cov==6.0.0"]

[project.scripts]
bibm-replicate = "bibm_replication.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

